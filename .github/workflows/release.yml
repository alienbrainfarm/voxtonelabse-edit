# Publish a complete release only after every platform has built successfully.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor HEAD origin/main

  build:
    needs: validate
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for target in macOS-arm64.zip macOS-x64.zip Windows-x64.zip Linux-x64.tar.gz; do
            test -s "dist/ToneLab-SE-Editor-${version}-${target}"
          done
          (cd dist && sha256sum -- *.zip *.tar.gz > SHA256SUMS.txt)
          if gh release view "$TAG" --json isDraft > release.json; then
            # A failed upload can be retried, but never replace a published release.
            jq -e '.isDraft == true' release.json
          else
            gh release create "$TAG" --verify-tag --draft --title "ToneLab SE Editor $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest
